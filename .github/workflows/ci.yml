
name: React CI

on:
  push:
    branches:
      - main
      - sudhanshu-development
  pull_request:
    branches:
      - main

jobs:
  build:
    name: PR CI - Install and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript checks and build
        run: npm run build